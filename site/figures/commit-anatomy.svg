<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一つのコミットに含まれる情報。固有のID、コミットメッセージ、作った人と日時、共同作者、変更の中身（削除は赤、追加は緑）。">
  <rect x="12" y="12" width="616" height="246" rx="14" class="bg ln" stroke-width="2"/>
  <text x="32" y="40" font-size="14" class="tx bold">一つのコミットに入っているもの</text>
  <rect x="24" y="54" width="190" height="44" rx="10" class="f-gray-s"/>
  <text x="119" y="73" text-anchor="middle" font-size="13" class="tx bold">固有のID（SHA）</text>
  <text x="119" y="90" text-anchor="middle" font-size="12" class="tm">例：3f9a2c1</text>
  <rect x="226" y="54" width="390" height="44" rx="10" class="f-green-s"/>
  <text x="241" y="73" font-size="13" class="tx bold">メッセージ</text>
  <text x="241" y="90" font-size="12" class="tx">日程表の第5回を10月28日に修正</text>
  <rect x="24" y="108" width="190" height="44" rx="10" class="f-blue-s"/>
  <text x="119" y="127" text-anchor="middle" font-size="13" class="tx bold">作った人と日時</text>
  <text x="119" y="144" text-anchor="middle" font-size="12" class="tm">誰が、いつ</text>
  <rect x="226" y="108" width="390" height="44" rx="10" class="f-purple-s"/>
  <text x="241" y="127" font-size="13" class="tx bold">共同作者（あれば）</text>
  <text x="241" y="144" font-size="12" class="tx">一緒に作業した人、AIエージェントなど</text>
  <rect x="24" y="164" width="592" height="84" rx="10" class="bgs ln" stroke-width="1.5"/>
  <text x="40" y="184" font-size="13" class="tx bold">変更の中身（前の状態との差）</text>
  <rect x="40" y="194" width="560" height="22" rx="4" class="f-red-s"/>
  <text x="52" y="210" font-size="12" class="tx">－　第5回　10月21日　GitHubの基本</text>
  <rect x="40" y="220" width="560" height="22" rx="4" class="f-green-s"/>
  <text x="52" y="236" font-size="12" class="tx">＋　第5回　10月28日　GitHubの基本</text>
</svg>
