<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Copilotを使える場所の地図。中心に自分のGitHubアカウントとCopilotのプランがあり、ブラウザのgithub.com、エディターのVS Code、スマートフォンのGitHub Mobile、ターミナルのCopilot CLIから同じCopilotを使える。この授業ではgithub.comとVS Codeをよく使う。">
  <!-- つなぐ線 -->
  <path d="M216 86L262 132" class="s-purple anim-dash" stroke-width="2.5" fill="none"/>
  <path d="M424 86L378 132" class="s-purple anim-dash" stroke-width="2.5" fill="none"/>
  <path d="M216 234L262 188" class="s-purple anim-dash" stroke-width="2.5" fill="none"/>
  <path d="M424 234L378 188" class="s-purple anim-dash" stroke-width="2.5" fill="none"/>

  <!-- 中心 -->
  <rect x="236" y="116" width="168" height="88" rx="16" class="f-purple"/>
  <text x="320" y="148" text-anchor="middle" font-size="16" class="tw round">GitHub Copilot</text>
  <text x="320" y="172" text-anchor="middle" font-size="12.5" class="tw">自分のGitHubアカウント</text>
  <text x="320" y="191" text-anchor="middle" font-size="12.5" class="tw">＋使えるプラン</text>

  <!-- github.com -->
  <rect x="16" y="22" width="200" height="80" rx="12" class="f-blue-s"/>
  <text x="30" y="50" font-size="15" class="tx bold">github.com</text>
  <text x="30" y="72" font-size="12.5" class="tm">ブラウザで開くGitHub</text>
  <text x="30" y="91" font-size="12" class="tx">チャット、クラウドエージェント</text>
  <rect x="150" y="34" width="56" height="22" rx="11" class="f-green-s"/>
  <text x="178" y="50" text-anchor="middle" font-size="11.5" class="t-green bold">よく使う</text>

  <!-- VS Code -->
  <rect x="424" y="22" width="200" height="80" rx="12" class="f-blue-s"/>
  <text x="438" y="50" font-size="15" class="tx bold">VS Code</text>
  <text x="438" y="72" font-size="12.5" class="tm">パソコンのエディター</text>
  <text x="438" y="91" font-size="12.5" class="tx">補完、チャット、エージェント</text>
  <rect x="558" y="34" width="56" height="22" rx="11" class="f-green-s"/>
  <text x="586" y="50" text-anchor="middle" font-size="11.5" class="t-green bold">よく使う</text>

  <!-- GitHub Mobile -->
  <rect x="16" y="218" width="200" height="80" rx="12" class="bgs"/>
  <text x="30" y="246" font-size="15" class="tx bold">GitHub Mobile</text>
  <text x="30" y="268" font-size="12.5" class="tm">スマートフォンのアプリ</text>
  <text x="30" y="287" font-size="12.5" class="tx">チャット、進み具合の確認</text>

  <!-- CLI -->
  <rect x="424" y="218" width="200" height="80" rx="12" class="bgs"/>
  <text x="438" y="246" font-size="15" class="tx bold">ターミナル</text>
  <text x="438" y="268" font-size="12.5" class="tm">文字で命令する画面</text>
  <text x="438" y="287" font-size="12.5" class="tx">Copilot CLI（発展）</text>
</svg>
