<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="新しいリポジトリを作る画面の模式図。1 Owner は持ち主、2 Repository name は半角英数字とハイフンの名前、3 Description は説明、4 Public と Private は公開範囲、5 Add README はオンにする、6 Create repository で作成する。">
  <!-- 画面 -->
  <rect x="14" y="14" width="380" height="392" rx="12" class="bg ln" stroke-width="1.5"/>
  <path d="M14 26a12 12 0 0 1 12-12h356a12 12 0 0 1 12 12v18H14z" class="bgs"/>
  <circle cx="32" cy="29" r="4" class="f-red"/><circle cx="46" cy="29" r="4" class="f-yellow"/><circle cx="60" cy="29" r="4" class="f-green"/>
  <text x="36" y="72" font-size="15" class="tx bold">Create a new repository</text>
  <path d="M36 84H372" class="ln" stroke-width="1"/>

  <!-- Owner / Repository name -->
  <text x="36" y="106" font-size="11.5" class="tm">Owner</text>
  <text x="156" y="106" font-size="11.5" class="tm">Repository name</text>
  <rect x="36" y="114" width="104" height="28" rx="6" class="bgs ln" stroke-width="1"/>
  <text x="46" y="133" font-size="12.5" class="tx">your-name ▾</text>
  <text x="146" y="134" font-size="16" class="tm">/</text>
  <rect x="156" y="114" width="216" height="28" rx="6" class="bg s-blue" stroke-width="1.5"/>
  <text x="166" y="133" font-size="12.5" class="tx">my-first-repo</text>

  <!-- Description -->
  <text x="36" y="168" font-size="11.5" class="tm">Description (optional)</text>
  <rect x="36" y="176" width="336" height="28" rx="6" class="bgs ln" stroke-width="1"/>
  <text x="46" y="195" font-size="12.5" class="tx">GitHubの練習用</text>

  <!-- Visibility -->
  <text x="36" y="230" font-size="11.5" class="tm">Choose visibility</text>
  <circle cx="44" cy="250" r="6" class="bg lnf" stroke-width="1.5"/>
  <text x="58" y="255" font-size="12.5" class="tx">Public</text>
  <circle cx="134" cy="250" r="6" class="bg s-blue" stroke-width="1.5"/>
  <circle cx="134" cy="250" r="3" class="f-blue"/>
  <text x="148" y="255" font-size="12.5" class="tx bold">Private</text>

  <!-- Add README -->
  <text x="36" y="294" font-size="12.5" class="tx">Add README</text>
  <rect x="130" y="281" width="38" height="20" rx="10" class="f-green"/>
  <circle cx="158" cy="291" r="7" class="bg"/>
  <text x="176" y="295" font-size="11.5" class="t-green bold">On</text>

  <!-- gitignore / license -->
  <text x="36" y="328" font-size="11.5" class="tm">.gitignore</text>
  <rect x="104" y="315" width="96" height="22" rx="5" class="bgs ln" stroke-width="1"/>
  <text x="112" y="330" font-size="11" class="tm">No .gitignore ▾</text>
  <text x="216" y="328" font-size="11.5" class="tm">License</text>
  <rect x="264" y="315" width="96" height="22" rx="5" class="bgs ln" stroke-width="1"/>
  <text x="272" y="330" font-size="11" class="tm">No license ▾</text>

  <!-- button -->
  <rect x="222" y="358" width="150" height="32" rx="7" class="f-green"/>
  <text x="297" y="379" text-anchor="middle" font-size="13" class="tw bold">Create repository</text>

  <!-- 番号 -->
  <g font-size="11.5" text-anchor="middle">
    <circle cx="28" cy="128" r="10" class="f-orange"/><text x="28" y="132" class="tw bold">1</text>
    <circle cx="380" cy="128" r="10" class="f-orange"/><text x="380" y="132" class="tw bold">2</text>
    <circle cx="380" cy="190" r="10" class="f-orange"/><text x="380" y="194" class="tw bold">3</text>
    <circle cx="214" cy="250" r="10" class="f-orange"/><text x="214" y="254" class="tw bold">4</text>
    <circle cx="214" cy="291" r="10" class="f-orange anim-pulse"/><text x="214" y="295" class="tw bold">5</text>
    <circle cx="206" cy="374" r="10" class="f-orange"/><text x="206" y="378" class="tw bold">6</text>
  </g>

  <!-- 説明 -->
  <g>
    <circle cx="428" cy="50" r="10" class="f-orange"/><text x="428" y="54" text-anchor="middle" font-size="11.5" class="tw bold">1</text>
    <text x="446" y="47" font-size="12.5" class="tx bold">Owner</text>
    <text x="446" y="66" font-size="12.5" class="tm">持ち主。ふつうは自分</text>

    <circle cx="428" cy="108" r="10" class="f-orange"/><text x="428" y="112" text-anchor="middle" font-size="11.5" class="tw bold">2</text>
    <text x="446" y="105" font-size="12.5" class="tx bold">Repository name</text>
    <text x="446" y="124" font-size="12.5" class="tm">半角英小文字・数字・ハイフン</text>

    <circle cx="428" cy="166" r="10" class="f-orange"/><text x="428" y="170" text-anchor="middle" font-size="11.5" class="tw bold">3</text>
    <text x="446" y="163" font-size="12.5" class="tx bold">Description</text>
    <text x="446" y="182" font-size="12.5" class="tm">一行の説明。日本語でよい</text>

    <circle cx="428" cy="224" r="10" class="f-orange"/><text x="428" y="228" text-anchor="middle" font-size="11.5" class="tw bold">4</text>
    <text x="446" y="221" font-size="12.5" class="tx bold">Public／Private</text>
    <text x="446" y="240" font-size="12.5" class="tm">迷ったら非公開（Private）</text>

    <circle cx="428" cy="282" r="10" class="f-orange"/><text x="428" y="286" text-anchor="middle" font-size="11.5" class="tw bold">5</text>
    <text x="446" y="279" font-size="12.5" class="tx bold">Add README</text>
    <text x="446" y="298" font-size="12.5" class="tm">オンにして説明のファイルを作る</text>

    <circle cx="428" cy="358" r="10" class="f-orange"/><text x="428" y="362" text-anchor="middle" font-size="11.5" class="tw bold">6</text>
    <text x="446" y="355" font-size="12.5" class="tx bold">Create repository</text>
    <text x="446" y="374" font-size="12.5" class="tm">押すとリポジトリができる</text>
  </g>
  <text x="446" y="330" font-size="11.5" class="tm">.gitignore、License：そのままでよい</text>
</svg>
