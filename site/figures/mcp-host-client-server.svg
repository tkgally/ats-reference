<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCPの構成図。AIアプリ（MCPホスト）の中に、サーバーごとのクライアントが二つある。それぞれがMCPサーバーにつながり、一つはパソコン内のファイル、もう一つはネット上のサービスを扱う。サーバーはツール、リソース、プロンプトを提供できる。">
  <rect x="12" y="12" width="616" height="256" rx="14" class="bg ln" stroke-width="2"/>
  <rect x="28" y="52" width="230" height="200" rx="12" class="f-purple-s"/>
  <text x="143" y="40" text-anchor="middle" font-size="14" class="tx bold">AIアプリ（MCPホスト）</text>
  <text x="143" y="76" text-anchor="middle" font-size="12" class="tm">例：Claude Code、VS Code</text>
  <rect x="48" y="96" width="190" height="56" rx="8" class="f-purple"/>
  <text x="143" y="120" text-anchor="middle" font-size="13" class="tw bold">クライアントA</text>
  <text x="143" y="140" text-anchor="middle" font-size="12" class="tw">サーバーAとの接続係</text>
  <rect x="48" y="176" width="190" height="56" rx="8" class="f-purple"/>
  <text x="143" y="200" text-anchor="middle" font-size="13" class="tw bold">クライアントB</text>
  <text x="143" y="220" text-anchor="middle" font-size="12" class="tw">サーバーBとの接続係</text>
  <path d="M240 124 L330 124" class="s-gray anim-dash" fill="none" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M240 204 L330 204" class="s-gray anim-dash" fill="none" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="285" y="112" text-anchor="middle" font-size="11" class="tm">MCP</text>
  <text x="285" y="192" text-anchor="middle" font-size="11" class="tm">MCP</text>
  <rect x="332" y="96" width="140" height="56" rx="8" class="f-teal-s"/>
  <text x="402" y="120" text-anchor="middle" font-size="13" class="tx bold">サーバーA</text>
  <text x="402" y="140" text-anchor="middle" font-size="12" class="tx">手元で動く</text>
  <rect x="332" y="176" width="140" height="56" rx="8" class="f-teal-s"/>
  <text x="402" y="200" text-anchor="middle" font-size="13" class="tx bold">サーバーB</text>
  <text x="402" y="220" text-anchor="middle" font-size="12" class="tx">ネット上で動く</text>
  <path d="M474 124 L500 124" class="s-gray" fill="none" stroke-width="2"/>
  <path d="M474 204 L500 204" class="s-gray" fill="none" stroke-width="2"/>
  <rect x="502" y="96" width="114" height="56" rx="8" class="f-blue-s"/>
  <text x="559" y="120" text-anchor="middle" font-size="13" class="tx bold">ファイル</text>
  <text x="559" y="140" text-anchor="middle" font-size="12" class="tx">自分のパソコン</text>
  <rect x="502" y="176" width="114" height="56" rx="8" class="f-blue-s"/>
  <text x="559" y="200" text-anchor="middle" font-size="13" class="tx bold">サービス</text>
  <text x="559" y="220" text-anchor="middle" font-size="12" class="tx">カレンダーなど</text>
  <text x="402" y="262" text-anchor="middle" font-size="12" class="tm">サーバーが出せるもの：ツール・リソース・プロンプト</text>
</svg>
