<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三つの場所の関係。左のCopilotアプリは、頼んだり会話したりする窓口で、ファイルの保管場所ではない。真ん中の自分のパソコンには、リポジトリのコピーがあり、エージェントはここでファイルを書き換えてコミットする。右のGitHubは、インターネット上の保管庫で、チームで共有する正式な置き場所。パソコンからGitHubへはプッシュで送り、GitHubからパソコンへはプルで取ってくる。仲間のパソコンも、同じようにGitHubとプッシュとプルでやりとりする。">
  <!-- Copilot app -->
  <rect x="10" y="20" width="176" height="190" rx="14" class="f-purple-s"/>
  <rect x="10" y="20" width="176" height="40" rx="14" class="f-purple"/>
  <rect x="10" y="46" width="176" height="14" class="f-purple"/>
  <text x="98" y="46" text-anchor="middle" font-size="15" class="tw bold round">Copilotアプリ</text>
  <text x="98" y="84" text-anchor="middle" font-size="13" class="tx bold">頼む・話す窓口</text>
  <rect x="28" y="98" width="140" height="26" rx="13" class="bg"/>
  <text x="98" y="116" text-anchor="middle" font-size="12" class="tx">「READMEを直して」</text>
  <rect x="28" y="132" width="140" height="26" rx="13" class="bg"/>
  <text x="98" y="150" text-anchor="middle" font-size="12" class="tx">「直しました」</text>
  <text x="98" y="182" text-anchor="middle" font-size="12" class="t-purple">チャットはファイルの</text>
  <text x="98" y="199" text-anchor="middle" font-size="12" class="t-purple">保管場所ではない</text>

  <!-- Local PC -->
  <rect x="232" y="20" width="176" height="190" rx="14" class="f-blue-s"/>
  <rect x="232" y="20" width="176" height="40" rx="14" class="f-blue"/>
  <rect x="232" y="46" width="176" height="14" class="f-blue"/>
  <text x="320" y="46" text-anchor="middle" font-size="15" class="tw bold round">自分のパソコン</text>
  <text x="320" y="84" text-anchor="middle" font-size="13" class="tx bold">リポジトリのコピー</text>
  <g font-size="12" class="tx">
    <rect x="252" y="96" width="136" height="64" rx="8" class="bg"/>
    <rect x="264" y="106" width="9" height="12" rx="1" class="f-blue"/><text x="280" y="116">README.md</text>
    <rect x="264" y="124" width="9" height="12" rx="1" class="f-blue"/><text x="280" y="134">index.html</text>
    <rect x="264" y="142" width="9" height="12" rx="1" class="f-blue"/><text x="280" y="152">…</text>
  </g>
  <text x="320" y="182" text-anchor="middle" font-size="12" class="t-blue">ファイルが実際に</text>
  <text x="320" y="199" text-anchor="middle" font-size="12" class="t-blue">変わるのはここ</text>

  <!-- GitHub -->
  <rect x="454" y="20" width="176" height="190" rx="14" class="f-green-s"/>
  <rect x="454" y="20" width="176" height="40" rx="14" class="f-green"/>
  <rect x="454" y="46" width="176" height="14" class="f-green"/>
  <text x="542" y="46" text-anchor="middle" font-size="15" class="tw bold round">GitHub</text>
  <text x="542" y="84" text-anchor="middle" font-size="13" class="tx bold">インターネット上の保管庫</text>
  <line x1="474" y1="118" x2="610" y2="118" class="s-green" stroke-width="4"/>
  <text x="474" y="110" font-size="11" class="tm">main</text>
  <path d="M500 118C512 118 512 142 526 142H596" class="s-orange" stroke-width="4" fill="none"/>
  <circle cx="556" cy="142" r="5" class="f-orange"/><circle cx="584" cy="142" r="5" class="f-orange"/>
  <text x="542" y="160" text-anchor="middle" font-size="11" class="t-orange">作業用のブランチ</text>
  <text x="542" y="182" text-anchor="middle" font-size="12" class="t-green">チームで共有する</text>
  <text x="542" y="199" text-anchor="middle" font-size="12" class="t-green">正式な置き場所</text>

  <!-- arrows app -> pc -->
  <path d="M188 100H226" class="s-purple" stroke-width="2.5" fill="none"/>
  <path d="M220 94l8 6-8 6" class="s-purple" stroke-width="2.5" fill="none"/>
  <text x="209" y="88" text-anchor="middle" font-size="11" class="t-purple">書き換え</text>
  <path d="M188 140H226" class="s-purple" stroke-width="2.5" fill="none"/>
  <path d="M220 134l8 6-8 6" class="s-purple" stroke-width="2.5" fill="none"/>
  <text x="209" y="160" text-anchor="middle" font-size="11" class="t-purple">コミット</text>

  <!-- arrows pc <-> github -->
  <path d="M410 100H448" class="s-green anim-dash" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <path d="M442 94l8 6-8 6" class="s-green" stroke-width="2.5" fill="none"/>
  <text x="431" y="88" text-anchor="middle" font-size="11" class="t-green">プッシュ</text>
  <path d="M452 140H414" class="s-teal anim-dash" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <path d="M420 134l-8 6 8 6" class="s-teal" stroke-width="2.5" fill="none"/>
  <text x="431" y="160" text-anchor="middle" font-size="11" class="t-teal">プル</text>

  <!-- teammates -->
  <rect x="454" y="262" width="80" height="54" rx="10" class="f-blue-s"/>
  <text x="494" y="285" text-anchor="middle" font-size="12" class="tx">仲間の</text>
  <text x="494" y="302" text-anchor="middle" font-size="12" class="tx">パソコン</text>
  <rect x="550" y="262" width="80" height="54" rx="10" class="f-blue-s"/>
  <text x="590" y="285" text-anchor="middle" font-size="12" class="tx">仲間の</text>
  <text x="590" y="302" text-anchor="middle" font-size="12" class="tx">パソコン</text>
  <path d="M494 214V258M590 214V258" class="lnf" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M488 222l6-8 6 8M584 222l6-8 6 8M488 250l6 8 6-8M584 250l6 8 6-8" class="lnf" stroke-width="2" fill="none"/>
  <text x="14" y="252" font-size="12" class="tm">左の二つ（アプリとパソコン）は一人一人のもの。</text>
  <text x="14" y="272" font-size="12" class="tm">GitHubだけが、チーム全員で共有する場所。</text>
  <text x="14" y="292" font-size="12" class="tm">仲間の変更は、プルするまで自分のパソコンには</text>
  <text x="14" y="312" font-size="12" class="tm">届かない。</text>
</svg>
