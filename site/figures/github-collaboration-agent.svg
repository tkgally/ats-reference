<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIエージェントとの作業の流れ。人がIssueで依頼し、AIがブランチで作業してプルリクエストを開く。人が差分を読み、必要なら修正を頼む。AIが修正し、最後に人がマージする。">
  <!-- レーン -->
  <rect x="10" y="16" width="620" height="92" rx="14" class="f-blue-s" opacity=".55"/>
  <rect x="10" y="146" width="620" height="92" rx="14" class="f-purple-s" opacity=".55"/>
  <text x="38" y="67" text-anchor="middle" font-size="16" class="t-blue round">人</text>
  <text x="38" y="197" text-anchor="middle" font-size="16" class="t-purple round">AI</text>

  <!-- 人の箱 -->
  <rect x="70" y="30" width="116" height="64" rx="10" class="bg s-blue" stroke-width="2"/>
  <text x="128" y="56" text-anchor="middle" font-size="13.5" class="tx bold">Issueで依頼</text>
  <text x="128" y="78" text-anchor="middle" font-size="11.5" class="tm">何を、どこまで</text>

  <rect x="384" y="30" width="116" height="64" rx="10" class="bg s-blue" stroke-width="2"/>
  <text x="442" y="56" text-anchor="middle" font-size="13.5" class="tx bold">差分を読む</text>
  <text x="442" y="78" text-anchor="middle" font-size="11.5" class="tm">Files changed</text>

  <rect x="516" y="30" width="104" height="64" rx="10" class="f-green"/>
  <text x="568" y="56" text-anchor="middle" font-size="13.5" class="tw bold">マージ</text>
  <text x="568" y="78" text-anchor="middle" font-size="11.5" class="tw">人が決める</text>

  <!-- AIの箱 -->
  <rect x="140" y="160" width="124" height="64" rx="10" class="bg s-purple" stroke-width="2"/>
  <text x="202" y="186" text-anchor="middle" font-size="13.5" class="tx bold">ブランチで作業</text>
  <text x="202" y="208" text-anchor="middle" font-size="11.5" class="tm">コミットを重ねる</text>

  <rect x="282" y="160" width="124" height="64" rx="10" class="bg s-purple" stroke-width="2"/>
  <text x="344" y="186" text-anchor="middle" font-size="13.5" class="tx bold">PRを開く</text>
  <text x="344" y="208" text-anchor="middle" font-size="11.5" class="tm">修正もここで</text>

  <!-- 矢印 -->
  <g class="lnf" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 96L190 156"/><path d="M181 152l9 4 1-10"/>
    <path d="M266 192H278"/><path d="M272 186l7 6-7 6"/>
    <path d="M380 158L412 98"/><path d="M403 102l9-4 2 10"/>
    <path d="M502 62H512"/><path d="M506 56l7 6-7 6"/>
  </g>
  <path d="M460 98C470 140 440 176 410 184" class="s-orange anim-dash" stroke-width="2.4" fill="none"/>
  <path d="M419 177l-9 7 10 4" class="s-orange" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="150" font-size="12.5" class="t-orange bold">コメントで</text>
  <text x="474" y="168" font-size="12.5" class="t-orange bold">修正を頼む</text>
</svg>
