<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="変更を元に戻す方法は、どの段階かで変わる。コミット前なら変更を捨てる。コミットした後なら、打ち消すコミットを作る（エージェントにrevertを頼む）。プルリクエストをマージした後なら、Revertボタンで取り消し用のプルリクエストを作る。どの場合も履歴は消えない。">
  <path d="M20 40H612" class="ln" stroke-width="3" stroke-linecap="round"/>
  <path d="M604 33l10 7-10 7" class="lnf" stroke-width="2.5" fill="none"/>
  <circle cx="110" cy="40" r="9" class="f-orange"/>
  <text x="110" y="74" text-anchor="middle" font-size="13.5" class="t-orange bold">編集中（コミット前）</text>
  <rect x="10" y="88" width="200" height="104" rx="12" class="f-orange-s s-orange" stroke-width="1.5"/>
  <text x="110" y="116" text-anchor="middle" font-size="14.5" class="tx bold">変更を捨てる</text>
  <path d="M30 128H190" class="ln" stroke-width="1"/>
  <text x="110" y="152" text-anchor="middle" font-size="12.5" class="tx">VS Code：変更を破棄</text>
  <text x="110" y="174" text-anchor="middle" font-size="12.5" class="tx">ブラウザ：Cancel changes</text>
  <circle cx="320" cy="40" r="9" class="f-green"/>
  <text x="320" y="74" text-anchor="middle" font-size="13.5" class="t-green bold">コミットした後</text>
  <rect x="220" y="88" width="200" height="104" rx="12" class="f-green-s s-green" stroke-width="1.5"/>
  <text x="320" y="116" text-anchor="middle" font-size="14.5" class="tx bold">打ち消すコミットを作る</text>
  <path d="M240 128H400" class="ln" stroke-width="1"/>
  <text x="320" y="152" text-anchor="middle" font-size="12.5" class="tx">エージェントにrevertを頼む</text>
  <text x="320" y="174" text-anchor="middle" font-size="12.5" class="tx">前の版を見て書き直す</text>
  <circle cx="530" cy="40" r="9" class="f-purple"/>
  <text x="530" y="74" text-anchor="middle" font-size="13.5" class="t-purple bold">プルリクエストをマージした後</text>
  <rect x="430" y="88" width="200" height="104" rx="12" class="f-purple-s s-purple" stroke-width="1.5"/>
  <text x="530" y="116" text-anchor="middle" font-size="14.5" class="tx bold">Revertボタン</text>
  <path d="M450 128H610" class="ln" stroke-width="1"/>
  <text x="530" y="152" text-anchor="middle" font-size="12.5" class="tx">取り消し用のPRができる</text>
  <text x="530" y="174" text-anchor="middle" font-size="12.5" class="tx">確かめてからマージ</text>
  <text x="320" y="224" text-anchor="middle" font-size="12.5" class="tm">どの方法でも、それまでの履歴は消えずに残る</text>
</svg>
