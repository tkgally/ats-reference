  <path d="M446 266C490 266 530 252 550 210" class="s-purple" stroke-width="2.2" fill="none"/>
  <path d="M543 215l7-5 1 9" class="s-purple" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="256" text-anchor="middle" font-size="11.5" class="t-purple">読む</text>
  <path d="M504 166H446" class="s-purple anim-dash" stroke-width="2.2" fill="none"/>
  <path d="M454 160l-8 6 8 6" class="s-purple" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="475" y="158" text-anchor="middle" font-size="11.5" class="t-purple bold">書く</text>
  <text x="320" y="322" text-anchor="middle" font-size="12" class="tm">人間は資料と問いを、AIは地道な整理を担当する</text>
</svg>
