<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="知識ベースの三つの層。人間は元資料をraw/に置き、Wikiを読み、スキーマ（AGENTS.md）をAIと相談して改訂する。AIエージェントはスキーマに従い、元資料を読んで、wiki/のページを書き、更新する。">
  <rect x="200" y="30" width="240" height="72" rx="12" class="f-orange-s s-orange" stroke-width="1.5"/>
  <text x="320" y="56" text-anchor="middle" font-size="15" class="tx bold">スキーマ（AGENTS.md）</text>
  <text x="320" y="80" text-anchor="middle" font-size="12.5" class="tm">構成・書き方・手順の約束事</text>
  <rect x="200" y="124" width="240" height="84" rx="12" class="f-teal-s s-teal" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="15" class="tx bold">Wiki（wiki/）</text>
  <rect x="246" y="155" width="24" height="28" rx="3" class="bg s-teal" stroke-width="1.2"/>
