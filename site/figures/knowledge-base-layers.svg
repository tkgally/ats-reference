  <path d="M281 163h14M281 169h10M281 175h12" class="s-teal" stroke-width="1.5"/>
  <rect x="306" y="155" width="24" height="28" rx="3" class="bg s-teal" stroke-width="1.2"/>
  <path d="M311 163h14M311 169h10M311 175h12" class="s-teal" stroke-width="1.5"/>
  <rect x="336" y="155" width="24" height="28" rx="3" class="bg s-teal" stroke-width="1.2"/>
  <path d="M341 163h14M341 169h10M341 175h12" class="s-teal" stroke-width="1.5"/>
  <rect x="366" y="155" width="24" height="28" rx="3" class="bg s-teal" stroke-width="1.2"/>
  <path d="M371 163h14M371 169h10M371 175h12" class="s-teal" stroke-width="1.5"/>
  <path d="M270 169h6M300 169h6M330 169h6M360 169h6" class="s-teal" stroke-width="1" fill="none"/>
  <text x="320" y="202" text-anchor="middle" font-size="11.5" class="tm">AIが書き、リンクでつなぐページ群</text>
  <rect x="200" y="230" width="240" height="72" rx="12" class="f-gray-s s-gray" stroke-width="1.5"/>
  <text x="320" y="256" text-anchor="middle" font-size="15" class="tx bold">元資料（raw/）</text>
  <text x="320" y="280" text-anchor="middle" font-size="12.5" class="tm">集めた資料。変更しない</text>
  <rect x="10" y="126" width="120" height="80" rx="14" class="f-blue-s"/>
  <text x="70" y="156" text-anchor="middle" font-size="15" class="tx bold">自分</text>
  <text x="70" y="178" text-anchor="middle" font-size="11.5" class="tm">資料を選ぶ</text>
  <text x="70" y="194" text-anchor="middle" font-size="11.5" class="tm">問いを立てる</text>
  <rect x="510" y="126" width="120" height="80" rx="14" class="f-purple-s"/>
  <text x="570" y="156" text-anchor="middle" font-size="15" class="tx bold">AIエージェント</text>
  <text x="570" y="178" text-anchor="middle" font-size="11.5" class="tm">読む・まとめる</text>
  <text x="570" y="194" text-anchor="middle" font-size="11.5" class="tm">書く・点検する</text>
