<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="リポジトリは、ファイルとその変更履歴をまとめて入れておく箱。GitHubのサーバーに置かれ、自分のパソコンやAIエージェント、仲間から読み書きできる。">
  <!-- 雲（GitHub） -->
  <path d="M170 60c8-30 50-40 72-18 16-26 66-24 78 6 30-6 56 18 50 44 26 6 32 50 0 58H180c-34 0-44-50-10-62-10-14-6-26 0-28z" class="f-gray-s"/>
  <text x="280" y="44" text-anchor="middle" font-size="15" class="tm bold">GitHub（インターネット上）</text>
  <!-- リポジトリの箱 -->
  <rect x="194" y="62" width="172" height="120" rx="12" class="bg s-blue" stroke-width="3"/>
  <text x="280" y="86" text-anchor="middle" font-size="16" class="t-blue round">リポジトリ</text>
  <!-- ファイル -->
  <g>
    <rect x="210" y="98" width="40" height="50" rx="4" class="f-blue-s"/>
    <rect x="216" y="108" width="28" height="4" rx="2" class="f-blue"/>
    <rect x="216" y="117" width="22" height="4" rx="2" class="f-blue" opacity=".6"/>
    <rect x="216" y="126" width="26" height="4" rx="2" class="f-blue" opacity=".6"/>
    <rect x="258" y="98" width="40" height="50" rx="4" class="f-blue-s"/>
    <rect x="264" y="108" width="28" height="4" rx="2" class="f-blue"/>
    <rect x="264" y="117" width="18" height="4" rx="2" class="f-blue" opacity=".6"/>
    <text x="230" y="164" text-anchor="middle" font-size="12" class="tm">ファイル</text>
  </g>
  <!-- 履歴 -->
  <g>
    <path d="M316 104v56" class="s-green" stroke-width="3"/>
    <circle cx="316" cy="104" r="6" class="f-green"/>
    <circle cx="316" cy="124" r="6" class="f-green"/>
    <circle cx="316" cy="144" r="6" class="f-green"/>
    <circle cx="316" cy="160" r="6" class="f-green"/>
    <text x="340" y="164" text-anchor="middle" font-size="12" class="tm">履歴</text>
  </g>
  <!-- 利用者 -->
  <g>
    <rect x="20" y="214" width="150" height="62" rx="12" class="f-blue-s"/>
    <text x="95" y="240" text-anchor="middle" font-size="15" class="tx bold">自分のパソコン</text>
    <text x="95" y="262" text-anchor="middle" font-size="12.5" class="tm">ブラウザ、VS Code</text>
    <rect x="245" y="214" width="150" height="62" rx="12" class="f-purple-s"/>
    <text x="320" y="240" text-anchor="middle" font-size="15" class="tx bold">AIエージェント</text>
    <text x="320" y="262" text-anchor="middle" font-size="12.5" class="tm">Copilotなど</text>
    <rect x="470" y="214" width="150" height="62" rx="12" class="f-orange-s"/>
    <text x="545" y="240" text-anchor="middle" font-size="15" class="tx bold">チームの仲間</text>
    <text x="545" y="262" text-anchor="middle" font-size="12.5" class="tm">招待した人</text>
  </g>
  <!-- 矢印 -->
  <path d="M110 210L210 186" class="s-blue anim-dash" stroke-width="2.5" fill="none"/>
  <path d="M310 210L290 188" class="s-purple anim-dash" stroke-width="2.5" fill="none"/>
  <path d="M520 210L360 184" class="s-orange anim-dash" stroke-width="2.5" fill="none"/>
  <!-- 右上の説明 -->
  <text x="430" y="96" font-size="13.5" class="tx">ファイルと、</text>
  <text x="430" y="118" font-size="13.5" class="tx">その変更の記録を</text>
  <text x="430" y="140" font-size="13.5" class="tx">ひとまとめにした箱</text>
</svg>
