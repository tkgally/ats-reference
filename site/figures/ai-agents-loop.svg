<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIエージェントの作業のループ。人が目標を伝えると、エージェントは計画を立て、道具を使って行動し、結果を観察し、目標に届いたかを判断する。届いていなければ計画に戻って繰り返し、届いたら人に報告する。道具を使う前には、必要に応じて人の許可を求める。">
  <!-- 円の道 -->
  <circle cx="330" cy="196" r="118" class="s-purple anim-dash" stroke-width="3" fill="none"/>
  <!-- 中心 -->
  <circle cx="330" cy="196" r="46" class="f-purple anim-pulse"/>
  <text x="330" y="192" text-anchor="middle" font-size="14" class="tw bold">AI</text>
  <text x="330" y="211" text-anchor="middle" font-size="12.5" class="tw">エージェント</text>


  <!-- 時計回りの矢じり -->
  <path d="M414.9 104.1L418.4 117.5L405.0 114.0" class="s-purple" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M421.9 280.9L408.5 284.4L412.0 271.0" class="s-purple" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M245.1 287.9L241.6 274.5L255.0 278.0" class="s-purple" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M238.1 111.1L251.5 107.6L248.0 121.0" class="s-purple" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ① 計画 (上) -->
  <rect x="266" y="58" width="128" height="40" rx="20" class="bg s-purple" stroke-width="2"/>
  <text x="330" y="83" text-anchor="middle" font-size="14" class="tx bold">① 計画する</text>
  <!-- ② 行動 (右) -->
  <rect x="384" y="176" width="142" height="40" rx="20" class="bg s-purple" stroke-width="2"/>
  <text x="455" y="201" text-anchor="middle" font-size="14" class="tx bold">② 道具を使う</text>
  <!-- ③ 観察 (下) -->
  <rect x="266" y="294" width="128" height="40" rx="20" class="bg s-purple" stroke-width="2"/>
  <text x="330" y="319" text-anchor="middle" font-size="14" class="tx bold">③ 結果を見る</text>
  <!-- ④ 判断 (左) -->
  <rect x="134" y="176" width="142" height="40" rx="20" class="bg s-purple" stroke-width="2"/>
  <text x="205" y="201" text-anchor="middle" font-size="14" class="tx bold">④ 判断する</text>

  <!-- 目標（人） -->
  <rect x="16" y="24" width="150" height="56" rx="12" class="f-blue-s"/>
  <text x="91" y="48" text-anchor="middle" font-size="14" class="tx bold">人が目標を伝える</text>
  <text x="91" y="68" text-anchor="middle" font-size="12" class="tm">「資料を取り込んで」</text>
  <path d="M168 54C210 54 230 78 262 78" class="s-blue" stroke-width="2.5" fill="none"/>
  <path d="M254 72l9 6-9 6" class="s-blue" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 報告 -->
  <path d="M170 218C120 240 100 270 100 300" class="s-green" stroke-width="2.5" fill="none"/>
  <path d="M94 292l6 10 6-10" class="s-green" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="96" y="252" text-anchor="end" font-size="12" class="t-green bold">終わったら</text>
  <rect x="16" y="306" width="150" height="56" rx="12" class="f-green-s"/>
  <text x="91" y="330" text-anchor="middle" font-size="14" class="tx bold">人に報告する</text>
  <text x="91" y="350" text-anchor="middle" font-size="12" class="tm">人が確かめる</text>
  <text x="276" y="142" text-anchor="middle" font-size="12" class="tm">まだなら①へ</text>

  <!-- 道具と許可 -->
  <rect x="470" y="24" width="154" height="92" rx="12" class="bgs"/>
  <text x="547" y="46" text-anchor="middle" font-size="12.5" class="tx bold">道具の例</text>
  <text x="484" y="68" font-size="12" class="tx">・ファイルの読み書き</text>
  <text x="484" y="86" font-size="12" class="tx">・ターミナルの命令</text>
  <text x="484" y="104" font-size="12" class="tx">・ウェブの検索</text>
  <rect x="470" y="262" width="154" height="56" rx="12" class="f-orange-s"/>
  <text x="547" y="286" text-anchor="middle" font-size="13" class="tx bold">人の許可</text>
  <text x="547" y="306" text-anchor="middle" font-size="12" class="tm">必要なときに求める</text>
  <path d="M500 260L476 220" class="s-orange anim-dash" stroke-width="2" fill="none"/>
</svg>
