<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="データを扱う進め方。問いを決める、データを集める、中身を点検する、AIに頼んで集計やグラフを作る、結果を自分で確かめる、の5段階を順に進み、確かめた結果から問いに戻ることもある。">
  <rect x="12" y="12" width="616" height="226" rx="14" class="bg ln" stroke-width="2"/>
  <rect x="24" y="40" width="108" height="86" rx="10" class="f-blue-s"/>
  <text x="78" y="68" text-anchor="middle" font-size="14" class="tx bold">1 問い</text>
  <text x="78" y="92" text-anchor="middle" font-size="12" class="tx">何を知りたい</text>
  <text x="78" y="108" text-anchor="middle" font-size="12" class="tx">のか</text>
  <rect x="140" y="40" width="108" height="86" rx="10" class="f-teal-s"/>
  <text x="194" y="68" text-anchor="middle" font-size="14" class="tx bold">2 データ</text>
  <text x="194" y="92" text-anchor="middle" font-size="12" class="tx">どこの何を</text>
  <text x="194" y="108" text-anchor="middle" font-size="12" class="tx">使うか</text>
  <rect x="256" y="40" width="108" height="86" rx="10" class="f-orange-s"/>
  <text x="310" y="68" text-anchor="middle" font-size="14" class="tx bold">3 点検</text>
  <text x="310" y="92" text-anchor="middle" font-size="12" class="tx">欠けや変な値を</text>
  <text x="310" y="108" text-anchor="middle" font-size="12" class="tx">自分の目で見る</text>
  <rect x="372" y="40" width="108" height="86" rx="10" class="f-purple-s"/>
  <text x="426" y="68" text-anchor="middle" font-size="14" class="tx bold">4 AIに頼む</text>
  <text x="426" y="92" text-anchor="middle" font-size="12" class="tx">集計、グラフ、</text>
  <text x="426" y="108" text-anchor="middle" font-size="12" class="tx">説明の下書き</text>
  <rect x="488" y="40" width="128" height="86" rx="10" class="f-green-s"/>
  <text x="552" y="68" text-anchor="middle" font-size="14" class="tx bold">5 確かめる</text>
  <text x="552" y="92" text-anchor="middle" font-size="12" class="tx">数字を元の表と</text>
  <text x="552" y="108" text-anchor="middle" font-size="12" class="tx">照らし合わせる</text>
  <path d="M132 83H138" class="lnf" stroke-width="2"/><path d="M248 83H254" class="lnf" stroke-width="2"/><path d="M364 83H370" class="lnf" stroke-width="2"/><path d="M480 83H486" class="lnf" stroke-width="2"/>
  <path d="M552 130V160H78V132" class="s-gray anim-dash" fill="none" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="320" y="186" text-anchor="middle" font-size="13" class="tx">確かめて分かったことから、問いやデータを見直して戻る。</text>
  <text x="320" y="212" text-anchor="middle" font-size="12" class="tm">AIの出番は4だけ。1、3、5は人間が受け持つ。</text>
</svg>
