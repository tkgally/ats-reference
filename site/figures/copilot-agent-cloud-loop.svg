<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHubのクラウドエージェントに作業を頼む流れ。1 人がIssueに作業を書いてCopilotに割り当てる。2 Copilotがcopilotで始まるブランチを作って作業する。3 Copilotがプルリクエストを開く。4 人がレビューし、直してほしい点があればコメントで頼むと、Copilotが同じブランチで作業を続ける。5 納得したら人がmainにマージする。">
  <!-- やり直しのループ -->
  <path d="M552 58C552 18 252 18 252 58" class="s-orange anim-dash" stroke-width="2.5" fill="none"/>
  <path d="M246 47l6 11 6-11" class="s-orange" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="300" y="8" width="204" height="24" rx="12" class="bg"/>
  <text x="402" y="25" text-anchor="middle" font-size="12.5" class="t-orange bold">直してほしい点をコメント</text>

  <!-- 上の箱 -->
  <rect x="16" y="60" width="140" height="70" rx="12" class="f-blue-s"/>
  <text x="86" y="82" text-anchor="middle" font-size="12" class="t-blue bold">① 人</text>
  <text x="86" y="102" text-anchor="middle" font-size="13" class="tx">Issueに作業を書き</text>
  <text x="86" y="120" text-anchor="middle" font-size="13" class="tx">Copilotに割り当て</text>

  <rect x="174" y="60" width="140" height="70" rx="12" class="f-purple-s"/>
  <text x="244" y="82" text-anchor="middle" font-size="12" class="t-purple bold">② Copilot</text>
  <text x="244" y="102" text-anchor="middle" font-size="13" class="tx">ブランチを作って</text>
  <text x="244" y="120" text-anchor="middle" font-size="13" class="tx">作業・コミット</text>

  <rect x="332" y="60" width="140" height="70" rx="12" class="f-purple-s"/>
  <text x="402" y="82" text-anchor="middle" font-size="12" class="t-purple bold">③ Copilot</text>
  <text x="402" y="102" text-anchor="middle" font-size="13" class="tx">プルリクエストを</text>
  <text x="402" y="120" text-anchor="middle" font-size="13" class="tx">開いて知らせる</text>

  <rect x="490" y="60" width="134" height="70" rx="12" class="f-blue-s"/>
  <text x="557" y="82" text-anchor="middle" font-size="12" class="t-blue bold">④ 人</text>
  <text x="557" y="102" text-anchor="middle" font-size="13" class="tx">変更を読んで</text>
  <text x="557" y="120" text-anchor="middle" font-size="13" class="tx">レビューする</text>

  <!-- 箱どうしの矢印 -->
  <path d="M158 95h12M166 90l5 5-5 5" class="lnf" stroke-width="2" fill="none"/>
  <path d="M316 95h12M324 90l5 5-5 5" class="lnf" stroke-width="2" fill="none"/>
  <path d="M474 95h12M482 90l5 5-5 5" class="lnf" stroke-width="2" fill="none"/>

  <!-- 履歴の図 -->
  <!-- main -->
  <path d="M30 280H600" class="s-green" stroke-width="5" stroke-linecap="round"/>
  <text x="30" y="306" font-size="13" class="t-green bold">main</text>
  <circle cx="60" cy="280" r="9" class="f-green"/>
  <!-- ブランチ -->
  <path d="M100 280C130 280 130 210 170 210H500C540 210 540 280 570 280" class="s-orange" stroke-width="4" fill="none"/>
  <circle cx="100" cy="280" r="9" class="f-green"/>
  <text x="196" y="240" font-size="12" class="t-orange bold">copilot/… ブランチ</text>
  <circle cx="214" cy="210" r="9" class="f-orange"/>
  <circle cx="262" cy="210" r="9" class="f-orange"/>
  <circle cx="310" cy="210" r="9" class="f-orange"/>
  <!-- PR -->
  <rect x="356" y="194" width="66" height="32" rx="8" class="bg s-purple" stroke-width="2"/>
  <text x="389" y="215" text-anchor="middle" font-size="13" class="t-purple bold">PR</text>
  <!-- 修正のコミット -->
  <circle cx="462" cy="210" r="9" class="f-orange anim-pulse"/>
  <text x="462" y="244" text-anchor="middle" font-size="11.5" class="tm">修正</text>
  <!-- マージ -->
  <circle cx="570" cy="280" r="12" class="f-green anim-pulse"/>
  <text x="570" y="312" text-anchor="middle" font-size="13" class="tx bold">⑤ 人がマージ</text>

  <!-- 上の箱と履歴を結ぶ点線 -->
  <path d="M86 132V268" class="ln" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <path d="M244 132V198" class="ln" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <path d="M389 132V192" class="ln" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <path d="M557 132V250" class="ln" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
</svg>
