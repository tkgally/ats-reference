<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="公開リポジトリはだれでも見られ、検索エンジンや、鍵を探す自動プログラムにも読まれる。非公開リポジトリは招待した人だけが見られる。どちらの場合も、一度コミットした内容は削除しても履歴に残るので、漏れたキーは無効にして作り直す必要がある。">
  <rect x="8" y="8" width="304" height="230" rx="14" class="f-red-s" opacity=".55"/>
  <text x="160" y="34" text-anchor="middle" font-size="15" class="t-red bold">公開（Public）</text>
  <rect x="104" y="96" width="112" height="72" rx="10" class="bg s-red" stroke-width="2"/>
  <circle cx="160" cy="124" r="16" class="s-red" fill="none" stroke-width="2"/><path d="M144 124h32M160 108c-8 8-8 24 0 32M160 108c8 8 8 24 0 32" class="s-red" fill="none" stroke-width="1.5"/>
  <text x="160" y="160" text-anchor="middle" font-size="12" class="tx">リポジトリ</text>
  <circle cx="48" cy="62" r="8" class="f-gray"/><path d="M35 86c0-10 6-14 13-14s13 4 13 14z" class="f-gray"/>
  <circle cx="272" cy="62" r="8" class="f-gray"/><path d="M259 86c0-10 6-14 13-14s13 4 13 14z" class="f-gray"/>
  <text x="48" y="104" text-anchor="middle" font-size="11.5" class="tm">だれでも</text>
  <text x="272" y="104" text-anchor="middle" font-size="11.5" class="tm">検索エンジン</text>
  <rect x="20" y="186" width="120" height="40" rx="8" class="f-red-s s-red anim-pulse" stroke-width="1.5"/>
  <text x="80" y="204" text-anchor="middle" font-size="11.5" class="t-red bold">鍵を探す</text>
  <text x="80" y="219" text-anchor="middle" font-size="11.5" class="t-red bold">自動プログラム</text>
  <rect x="180" y="186" width="120" height="40" rx="8" class="bgs"/>
  <text x="240" y="204" text-anchor="middle" font-size="11.5" class="tx">履歴も含めて</text>
  <text x="240" y="219" text-anchor="middle" font-size="11.5" class="tx">全部見える</text>
  <path d="M64 70L102 110M256 70L218 110M100 186L128 170" class="s-red anim-dash" stroke-width="2" fill="none"/>
  <rect x="328" y="8" width="304" height="230" rx="14" class="f-green-s" opacity=".55"/>
  <text x="480" y="34" text-anchor="middle" font-size="15" class="t-green bold">非公開（Private）</text>
  <rect x="424" y="96" width="112" height="72" rx="10" class="bg s-green" stroke-width="2"/>
  <rect x="468" y="118" width="24" height="20" rx="3" class="f-green"/><path d="M473 118v-6a7 7 0 0 1 14 0v6" class="s-green" fill="none" stroke-width="2.5"/>
  <text x="480" y="160" text-anchor="middle" font-size="12" class="tx">リポジトリ</text>
  <circle cx="368" cy="62" r="8" class="f-blue"/><path d="M355 86c0-10 6-14 13-14s13 4 13 14z" class="f-blue"/>
  <circle cx="592" cy="62" r="8" class="f-orange"/><path d="M579 86c0-10 6-14 13-14s13 4 13 14z" class="f-orange"/>
  <text x="368" y="104" text-anchor="middle" font-size="11.5" class="tm">自分</text>
  <text x="592" y="104" text-anchor="middle" font-size="11.5" class="tm">招待した人</text>
  <path d="M386 70L422 110M574 70L538 110" class="s-green" stroke-width="2" fill="none"/>
  <circle cx="368" cy="184" r="8" class="f-gray-s"/><path d="M355 208c0-10 6-14 13-14s13 4 13 14z" class="f-gray-s"/>
  <path d="M356 178l24 24" class="s-red" stroke-width="2.5"/>
  <text x="368" y="226" text-anchor="middle" font-size="11.5" class="tm">ほかの人</text>
  <text x="510" y="200" text-anchor="middle" font-size="12" class="tx">それでも秘密の鍵は</text>
  <text x="510" y="218" text-anchor="middle" font-size="12" class="tx">置かないのが原則</text>
  <text x="20" y="272" font-size="14" class="tx bold">どちらでも：消しても履歴に残る</text>
  <path d="M30 316H600" class="s-green" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="316" r="11" class="f-green"/>
  <text x="70" y="346" text-anchor="middle" font-size="12" class="tx">資料を追加</text>
  <circle cx="220" cy="316" r="11" class="f-red"/>
  <text x="220" y="346" text-anchor="middle" font-size="12" class="t-red bold">APIキーを追加</text>
  <circle cx="370" cy="316" r="11" class="f-green"/>
  <text x="370" y="346" text-anchor="middle" font-size="12" class="tx">APIキーを削除</text>
  <circle cx="520" cy="316" r="11" class="f-green"/>
  <text x="520" y="346" text-anchor="middle" font-size="12" class="tx">いまの状態</text>
  <path d="M366 304C330 292 262 292 228 303" class="s-red anim-dash" stroke-width="2" fill="none"/>
  <path d="M227 304l4-9M227 304l10 0" class="s-red" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="297" y="286" text-anchor="middle" font-size="11.5" class="t-red">過去のコミットから読める</text>
  <text x="320" y="384" text-anchor="middle" font-size="12.5" class="t-red bold">漏れたキーは、削除ではなく無効にして作り直す</text>
</svg>
