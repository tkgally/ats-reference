<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Pagesで公開する二つの方法。方法Aでは、mainブランチのdocsフォルダーにあるファイルを、そのままサイトとして公開する。方法Bでは、GitHub Actionsのワークフローがファイルを取り出し、必要なら組み立て、まとめて公開する。どちらも公開先はhttps://アカウント名.github.io/リポジトリ名/になる。">
  <rect x="12" y="12" width="616" height="306" rx="14" class="bg ln" stroke-width="2"/>
  <text x="166" y="42" text-anchor="middle" font-size="15" class="t-blue bold">方法A：docs/から公開</text>
  <text x="474" y="42" text-anchor="middle" font-size="15" class="t-purple bold">方法B：GitHub Actionsで公開</text>
  <rect x="36" y="58" width="260" height="70" rx="10" class="f-green-s"/>
  <text x="166" y="84" text-anchor="middle" font-size="13" class="tx bold">リポジトリ（mainブランチ）</text>
  <text x="166" y="106" text-anchor="middle" font-size="12" class="tx">docs/index.html</text>
  <text x="166" y="122" text-anchor="middle" font-size="12" class="tm">docs/の中だけが公開される</text>
  <rect x="344" y="58" width="260" height="70" rx="10" class="f-green-s"/>
  <text x="474" y="84" text-anchor="middle" font-size="13" class="tx bold">リポジトリ（mainブランチ）</text>
  <text x="474" y="106" text-anchor="middle" font-size="12" class="tx">.github/workflows/static.yml</text>
  <text x="474" y="122" text-anchor="middle" font-size="12" class="tm">公開の手順を書いたファイル</text>
  <path d="M166 132V160" class="lnf anim-dash" fill="none" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M474 132V160" class="lnf anim-dash" fill="none" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="36" y="164" width="260" height="70" rx="10" class="f-blue-s"/>
  <text x="166" y="190" text-anchor="middle" font-size="13" class="tx bold">設定：Deploy from a branch</text>
  <text x="166" y="212" text-anchor="middle" font-size="12" class="tx">ブランチ main、フォルダー /docs</text>
  <text x="166" y="228" text-anchor="middle" font-size="12" class="tm">ファイルを置けば、そのまま公開</text>
  <rect x="344" y="164" width="260" height="70" rx="10" class="f-purple-s"/>
  <text x="474" y="190" text-anchor="middle" font-size="13" class="tx bold">設定：GitHub Actions</text>
  <text x="474" y="212" text-anchor="middle" font-size="12" class="tx">取り出す → 組み立てる → まとめる → 公開</text>
  <text x="474" y="228" text-anchor="middle" font-size="12" class="tm">組み立ての手順を自由に足せる</text>
  <path d="M166 238L250 268" class="lnf anim-dash" fill="none" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M474 238L390 268" class="lnf anim-dash" fill="none" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="140" y="270" width="360" height="38" rx="10" class="f-teal-s"/>
  <text x="320" y="294" text-anchor="middle" font-size="13" class="tx bold">https://アカウント名.github.io/リポジトリ名/</text>
</svg>
