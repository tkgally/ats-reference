<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="{{root}}static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}static/style.css">
<script>try{var t=localStorage.getItem("ats-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="kind-{{kind}}" data-root="{{root}}">
<a class="skip" href="#main">本文へ移動</a>
<header class="site-header">
  <button class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="メニュー">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="{{root}}index.html">
    <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" class="bm-bg"/><path d="M8 21l5-11 4 7 3-4 4 8" class="bm-line"/><circle cx="13" cy="10" r="2" class="bm-dot"/></svg>
    <span class="brand-text"><span class="brand-name">{{site_name}}</span><span class="brand-sub">{{site_subtitle}}</span></span>
  </a>
  <nav class="top-nav" aria-label="サイト">
    <a href="{{root}}guide/index.html">解説</a>
    <a href="{{root}}wiki/index.html">Wiki</a>
    <a href="{{root}}search.html" aria-label="検索"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="nav-label">検索</span></a>
    <button class="theme-button" type="button" aria-label="表示の明るさを切り替える" title="明るい表示／暗い表示">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
    </button>
  </nav>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav aria-label="ページ一覧">{{nav}}
      <p class="nav-title nav-switch"><a href="{{root}}guide/index.html">解説の一覧</a> ・ <a href="{{root}}wiki/index.html">Wikiの目録</a></p>
    </nav>
  </aside>
  <main id="main" class="main">
{{content}}
  </main>
</div>
<footer class="site-footer">
  <p>{{site_name}}は、東京都市大学「AIとの探検ゼミナール」（2026年度後期）の受講生のための解説サイトです。AIエージェントが<a href="{{repo_url}}">知識ベースのリポジトリ</a>をもとに作成・更新しています。ツールの料金や機能などは変わりやすいので、日付のある情報は公式の案内でも確かめてください。</p>
  <p class="muted"><a href="{{source_url}}">このページのもとになったファイル</a> ・ 最終ビルド：{{build_date}}</p>
</footer>
<script src="{{root}}static/site.js" defer></script>
</body>
</html>
